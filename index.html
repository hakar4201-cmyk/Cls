<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حیسابکەر</title>
<style>
:root{--bg:#f3f5f7;--s:#fff;--t:#14202b;--m:#5b6b7a;--l:#d5dde4;--a:#0f6b5c;--at:#fff;--e:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e151b;--s:#16212a;--t:#e8eef3;--m:#93a4b3;--l:#2a3a47;--a:#3cc4a8;--at:#06231d;--e:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,system-ui,sans-serif;line-height:1.4;padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:0 auto;padding:8px 10px 24px}
.c{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:10px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
textarea,#cur{width:100%;direction:ltr;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:8px;font:inherit;font-size:1rem;padding:6px}
textarea{min-height:40px;text-align:left;resize:none}
#cur{margin-top:8px;text-align:center;font-size:1.1rem}
button{font:inherit;cursor:pointer;border-radius:8px}
.r{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
#clr{padding:2px 14px;font-size:.85rem;color:var(--m);background:none;border:1px solid var(--l);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.o{display:flex;align-items:center;gap:8px;margin-top:6px}
#out{flex:1;text-align:center;font-size:1.5rem;font-weight:700;direction:ltr;word-break:break-all}
.y{background:#ffd60a;color:#14202b;font-weight:700;font-size:1.5rem;padding:2px 14px;border-radius:8px;direction:ltr;min-width:2.4rem;text-align:center}
.y:empty{display:none}
#out.e{color:var(--e);font-size:1rem;direction:rtl}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px auto 0;max-width:200px}
.pad button{padding:6px 0;font-size:1rem;color:var(--t);background:var(--bg);border:1px solid var(--l)}
.pad .ok{color:var(--at);background:var(--a);border-color:var(--a)}
</style>
</head>
<body>
<main>
<div class="c">
<label for="inp">ژمارەکان</label>
<textarea id="inp" rows="1" readonly inputmode="none"></textarea>
<div class="r"><button id="clr" type="button">سڕینەوە</button></div>
<div class="o"><span id="f1" class="y"></span><span id="f2" class="y"></span><div id="out"></div></div>
<input id="cur" type="text" readonly inputmode="none">
<div class="pad" id="pad">
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">OK</button>
</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id),inp=$('inp'),out=$('out'),cur=$('cur'),clr=$('clr');
const W=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const mod=(n,m)=>((n%m)+m)%m,cat=(a,b)=>parseInt(''+a+b,10);
let L=[34,10,23,27,14,12,9];
function calc(a){
if(a.length<4)throw new Error('بەلانی کەم ٤ ژمارە پێویستە.');
const C=a.slice(0,4).map(n=>cat(Math.floor(n/10)**2,n%10));
if(C[2]===0)throw new Error('دابەشکردن بە سفر.');
const num=Math.floor((C[0]+C[1])/C[2])-C[3];
const pr=Math.abs(a[1]+a[2]+a[3]+Math.abs(num));
const i=W.indexOf(a[0]);
if(i<0)throw new Error('ژمارەی یەکەم دەبێت لە ٠ تا ٣٦ بێت.');
const r=[-3,-2,-1,0,1,2,3].map(j=>Math.trunc(parseFloat('0.'+W[mod(i+j,37)])*pr));
const A=[...new Set(r.filter(x=>x<=36))].sort((x,y)=>x-y);
const s=A.reduce((x,y)=>x+y,0)-123;
if(!A.length)return {s,err:'ئەنجام بەتاڵە.'};
let k=A[0]-2;if(k<0)k+=a.length;
if(k<0||k>=a.length)return {s,err:'ژمارەی لیستەکە کەمە.'};
return {s,last:a[k]};
}
function run(){
inp.value=L.slice(0,6).join(',');
out.className='';out.textContent='';$('f1').textContent='';$('f2').textContent='';
if(L.length<4)return;
try{
const r=calc(L);
$('f1').textContent=r.s;
if(r.err){out.className='e';out.textContent=r.err}else $('f2').textContent=r.last;
}catch(e){out.className='e';out.textContent=e.message}
}
let tm,iv;
function stop(){clearTimeout(tm);clearInterval(iv)}
function del1(){L.shift();run();if(!L.length)stop()}
clr.onpointerdown=e=>{e.preventDefault();stop();del1();tm=setTimeout(()=>{iv=setInterval(del1,110)},350)};
clr.onpointerup=clr.onpointerleave=clr.onpointercancel=stop;
clr.oncontextmenu=e=>e.preventDefault();
$('pad').onclick=e=>{
const b=e.target.closest('button');if(!b)return;
const k=b.dataset.k;
if(k==='ok'){
if(!cur.value)return;
L.unshift(parseInt(cur.value,10));
cur.value='';run();
}else if(k==='del')cur.value=cur.value.slice(0,-1);
else cur.value+=k;
};
run();
</script>
</body>
</html>
