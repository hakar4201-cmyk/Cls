<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حیسابکەر</title>
<style>
:root{--bg:#f3f5f7;--s:#fff;--t:#14202b;--m:#5b6b7a;--l:#d5dde4;--a:#0f6b5c;--at:#fff;--e:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e151b;--s:#16212a;--t:#e8eef3;--m:#93a4b3;--l:#2a3a47;--a:#3cc4a8;--at:#06231d;--e:#ff8a80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,system-ui,sans-serif;line-height:1.4;padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:0 auto;padding:8px 10px 24px}
.c{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:10px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
textarea,#cur{width:100%;direction:ltr;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:8px;font:inherit;font-size:1rem;padding:6px}
textarea{min-height:56px;text-align:left}
#cur{margin-top:8px;text-align:center;font-size:1.1rem}
button{font:inherit;cursor:pointer;border-radius:8px}
.r{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
#clr{padding:2px 14px;font-size:.85rem;color:var(--m);background:none;border:1px solid var(--l);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.y{background:#ffd60a;color:#14202b;font-weight:700;font-size:1.1rem;padding:0 12px;border-radius:8px;direction:ltr;min-width:2.4rem;text-align:center}
.y:empty{display:none}
#out{margin-top:6px;text-align:center;font-size:2rem;font-weight:700;direction:ltr;word-break:break-all}
#out.e{color:var(--e);font-size:1rem;direction:rtl}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px auto 0;max-width:200px}
.pad button{padding:6px 0;font-size:1rem;color:var(--t);background:var(--bg);border:1px solid var(--l)}
.pad .ok,.g .o{color:var(--at);background:var(--a);border-color:var(--a)}
.tg{display:block;margin:10px auto 0;padding:4px 20px;color:var(--t);background:var(--s);border:1px solid var(--l)}
#calc{margin-top:8px}
#ce{min-height:1.2em;font-size:.8rem;color:var(--m);text-align:left;direction:ltr}
#cv{font-size:1.5rem;font-weight:700;text-align:left;direction:ltr;word-break:break-all;margin-bottom:6px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.g button{padding:8px 0;font-size:1.1rem;color:var(--t);background:var(--bg);border:1px solid var(--l)}
.g .z{grid-column:span 2}
</style>
</head>
<body>
<main>
<div class="c">
<label for="inp">ژمارەکان</label>
<textarea id="inp" inputmode="none">30,35,13,24,2,6,15,25,13,35,35,17,20,19,17,23,34</textarea>
<div class="r"><button id="clr" type="button">سڕینەوە</button><span id="f" class="y"></span></div>
<div id="out"></div>
<input id="cur" type="text" readonly inputmode="none">
<div class="pad" id="pad">
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">OK</button>
</div>
</div>
<button class="tg" id="ct" type="button">حاسیبە</button>
<div class="c" id="calc" hidden>
<div id="ce"></div><div id="cv">0</div>
<div class="g">
<button class="z" data-c="C">C</button><button class="z" data-c="⌫">⌫</button>
<button class="o" data-c="÷">÷</button><button data-c="1">1</button><button data-c="2">2</button><button data-c="3">3</button>
<button class="o" data-c="×">×</button><button data-c="4">4</button><button data-c="5">5</button><button data-c="6">6</button>
<button class="o" data-c="−">−</button><button data-c="7">7</button><button data-c="8">8</button><button data-c="9">9</button>
<button class="o" data-c="+">+</button><button data-c=".">.</button><button data-c="0">0</button><button class="o" data-c="=">=</button>
</div>
</div>
</main>
<script>
const R=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const $=id=>document.getElementById(id),inp=$('inp'),out=$('out'),cur=$('cur'),clr=$('clr');
const mod=(n,m)=>((n%m)+m)%m,cat=(a,b)=>parseInt(''+a+b,10);
function calc(a){
if(a.length<6)throw new Error('بەلانی کەم ٦ ژمارە پێویستە.');
if(a[2]===0)throw new Error('ژمارەی سێیەم نابێت سفر بێت.');
const num=Math.abs(Math.floor((a[0]+a[1])/a[2])-a[3]);
const i=R.indexOf(num);
if(i<0)throw new Error('ژمارەی '+num+' لە لیستی r نییە.');
const L=R[mod(i-1,37)],Rt=R[mod(i+1,37)];
const p1=cat(L,a[0]),p2=cat(num,a[1]),p3=cat(Rt,a[2]);
const q1=cat(a[3],L),q2=cat(a[4],num),q3=cat(a[5],Rt);
const A=p1+p2+p3+p3+q1+q2+q3+q3+a[0]-p2-q2;
const B=[];
for(let k=1;k<=36;k++)B.push([k*(k-1)*10,k]);
B.sort((x,y)=>Math.abs(x[0]-A)-Math.abs(y[0]-A));
const t=B.slice(0,2).sort((x,y)=>x[0]-y[0]);
const c=v=>{const s=String(v).slice(1,-1);if(!s)throw new Error('ژمارە زۆر بچووکە.');return parseInt(s,10)};
return Math.floor((c(t[0][0])+c(t[1][0])-100)/2);
}
const parse=()=>inp.value.split(/[^0-9-]+/).filter(Boolean).map(Number).filter(Number.isFinite);
function run(){
const az=parse();
$('f').textContent=az.length>2?az[2]:'';
out.className='';
if(az.length<6){out.textContent='';return}
try{out.textContent=calc(az)}catch(e){out.className='e';out.textContent=e.message}
}
inp.oninput=run;
let tm,iv;
function stop(){clearTimeout(tm);clearInterval(iv)}
function del1(){const t=parse();t.shift();inp.value=t.join(',');run();if(!t.length)stop()}
clr.onpointerdown=e=>{e.preventDefault();stop();del1();tm=setTimeout(()=>{iv=setInterval(del1,110)},350)};
clr.onpointerup=clr.onpointerleave=clr.onpointercancel=stop;
clr.oncontextmenu=e=>e.preventDefault();
$('pad').onclick=e=>{
const b=e.target.closest('button');if(!b)return;
const k=b.dataset.k;
if(k==='ok'){
if(!cur.value)return;
const t=inp.value.trim();
inp.value=cur.value+(t?','+t:'');
cur.value='';run();
}else if(k==='del')cur.value=cur.value.slice(0,-1);
else cur.value+=k;
};
$('ct').onclick=()=>{$('calc').hidden=!$('calc').hidden};
let cc='0',ca=null,co=null,cf=false;
const fmt=n=>String(parseFloat(n.toPrecision(12)));
const ap=(a,o,b)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;
function show(){$('cv').textContent=cc;$('ce').textContent=co?fmt(ca)+' '+co:''}
$('calc').onclick=e=>{
const b=e.target.closest('button');if(!b)return;
const k=b.dataset.c;
if(/^[0-9]$/.test(k)){cc=(cf||cc==='0')?k:cc+k;cf=false}
else if(k==='.'){if(cf){cc='0.';cf=false}else if(!cc.includes('.'))cc+='.'}
else if(k==='C'){cc='0';ca=null;co=null;cf=false}
else if(k==='⌫'){if(!cf)cc=cc.length>1?cc.slice(0,-1):'0'}
else if(k==='='){if(co){const r=ap(ca,co,parseFloat(cc));cc=isNaN(r)?'خەتا':fmt(r);ca=null;co=null;cf=true}}
else{
if(cc==='خەتا')cc='0';
if(co&&!cf){const r=ap(ca,co,parseFloat(cc));if(isNaN(r)){cc='خەتا';ca=null;co=null;cf=true;show();return}ca=r;cc=fmt(r)}
else ca=parseFloat(cc);
co=k;cf=true;
}
show();
};
run();
</script>
</body>
</html>
