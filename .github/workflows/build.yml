name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create project
        run: |
          mkdir app && cd app && mkdir www
          cat > www/index.html <<'EOF_HTML'
          <!DOCTYPE html>
          <html lang="ckb" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>حیسابکەر</title>
          <style>
          :root{
            --bg:#f3f5f7; --surface:#ffffff; --text:#14202b; --muted:#5b6b7a;
            --line:#d5dde4; --accent:#0f6b5c; --accent-text:#ffffff; --err:#b3261e;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top,0px);
            padding-bottom:env(safe-area-inset-bottom,0px);
          }
          @media (prefers-color-scheme:dark){
            :root:not([data-theme="light"]){
              --bg:#0e151b; --surface:#16212a; --text:#e8eef3; --muted:#93a4b3;
              --line:#2a3a47; --accent:#3cc4a8; --accent-text:#06231d; --err:#ff8a80;
            }
          }
          :root[data-theme="dark"]{
            --bg:#0e151b; --surface:#16212a; --text:#e8eef3; --muted:#93a4b3;
            --line:#2a3a47; --accent:#3cc4a8; --accent-text:#06231d; --err:#ff8a80;
          }
          *{box-sizing:border-box}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          body{
            margin:0; background:var(--bg); color:var(--text);
            font-family:"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
            line-height:1.4; min-height:100vh;
          }
          main{max-width:520px; margin:0 auto; padding:8px 10px 16px}
          h1{font-size:1.6rem; margin:8px 0 4px}
          p.hint{color:var(--muted); margin:0 0 16px}
          .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px}
          label{display:block; font-weight:700; font-size:.9rem; margin-bottom:4px}
          textarea{
            width:100%; min-height:56px; resize:vertical; padding:6px;
            font:inherit; font-size:1rem; direction:ltr; text-align:left;
            color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px;
          }
          textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
          button{
            margin-top:12px; width:100%; padding:14px; font:inherit; font-size:1.1rem; font-weight:700;
            color:var(--accent-text); background:var(--accent); border:0; border-radius:8px; cursor:pointer;
          }
          .result{margin-top:6px; text-align:center}
          .result .num{font-size:2rem; font-weight:700; direction:ltr; word-break:break-all}
          .result .err{color:var(--err); font-weight:700}
          .steps{margin-top:16px; border-top:1px solid var(--line); padding-top:12px; color:var(--muted); font-size:.95rem; direction:ltr; text-align:left}
          .steps div{display:flex; justify-content:space-between; gap:12px; padding:2px 0}
          .steps b{color:var(--text)}
          #cur{width:100%; margin-top:8px; padding:4px; font:inherit; font-size:1.1rem; direction:ltr; text-align:center; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px}
          .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:6px auto 0; max-width:200px}
          .pad button{margin:0; padding:6px 0; font-size:1rem; color:var(--text); background:var(--bg); border:1px solid var(--line)}
          .pad button:active{background:var(--line)}
          .pad button.ok{color:var(--accent-text); background:var(--accent); border-color:var(--accent)}
          .row{display:flex; justify-content:center; gap:16px; direction:ltr; font-size:1rem; color:var(--muted)}
          .row b{color:var(--text)}
          .clear{width:auto; margin-top:4px; padding:2px 10px; font-size:.8rem; font-weight:400; color:var(--muted); background:transparent; border:1px solid var(--line)}
          </style>
          </head>
          <body>
          <main>
            <div class="card">
              <label for="inp">ژمارەکان (٧ ژمارە)</label>
              <textarea id="inp" inputmode="none">22,8,10,21,14,18,12</textarea>
              <button id="clr" type="button" class="clear">سړینەوەی هەموو</button>
              <div class="result" id="out" aria-live="polite"></div>
              <input id="cur" type="text" readonly inputmode="none" aria-label="ژمارە">
              <div class="pad" id="pad">
                <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
                <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
                <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
                <button type="button" data-k="del" aria-label="سرینەوە">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="ok">OK</button>
              </div>
            </div>
          </main>
          <script>
          const R=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
          const inp=document.getElementById('inp'), out=document.getElementById('out');
          const mod=(n,m)=>((n%m)+m)%m;
          const cat=(a,b)=>parseInt(String(a)+String(b),10);

          function calc(a){
            if(a.length<4) throw new Error('بەلانی کەم ٤ ژمارە پێویستە.');
            if(a[2]===0) throw new Error('ژمارەی سێیەم نابێت سفر بێت.');
            const num=Math.abs(Math.floor((a[0]+a[1])/a[2])-a[3]);
            const i=R.indexOf(num);
            if(i<0) throw new Error('ژمارەی '+num+' لە لیستی r نییە.');
            const left=R[mod(i-1,37)], right=R[mod(i+1,37)];
            const p1=cat(left,a[0]), p2=cat(num,a[1]), p3=cat(right,a[2]);
            const p11=cat(a[0],left), p22=cat(a[1],num), p33=cat(a[2],right);
            const A=(p1+p2+p3)+p3;
            const A11=(p11+p22+p33)+p33;
            const Ar=(A+A11+a[0]-p2-p22)/2;
            const Ai=Math.trunc(Ar);
            const B=[];
            for(let k=1;k<=36;k++) B.push([k*(k-1)*10,k]);
            B.sort((x,y)=>Math.abs(x[0]-Ai)-Math.abs(y[0]-Ai));
            const top=B.slice(0,2).sort((x,y)=>x[0]-y[0]).map(j=>[j[1],j[0],Math.abs(Ai-j[0])]);
            return {Ar,top};
          }

          function run(){
            try{
              const az=inp.value.replace(/[،؛;\s]+/g,',').split(',').filter(Boolean).map(x=>{
                const n=parseInt(x,10); if(Number.isNaN(n)) throw new Error('"'+x+'" ژمارە نییە.'); return n;});
              const r=calc(az);
              const f=Number.isInteger(r.Ar)?r.Ar+'.0':String(r.Ar);
              out.innerHTML='<div class="num">'+f+'</div>'+r.top.map(t=>'<div class="row"><b>'+t[0]+'</b><span>'+t[1]+'</span><span>'+t[2]+'</span></div>').join('');
            }catch(e){
              out.innerHTML='<div class="err">'+e.message.replace(/</g,'&lt;')+'</div>';
            }
          }
          const cur=document.getElementById('cur');
          document.getElementById('clr').addEventListener('click',()=>{inp.value='';cur.value='';out.innerHTML='';});
          document.getElementById('pad').addEventListener('click',e=>{
                        const b=e.target.closest('button'); if(!b) return;
            const k=b.dataset.k;
            if(k==='ok'){
              if(!cur.value) return;
              const t=inp.value.trim();
              inp.value=cur.value+(t?','+t:'');
              cur.value='';
              run();
            } else if(k==='del') cur.value=cur.value.slice(0,-1);
            else cur.value+=k;
          });

          run();
          </script>
          </body>
          </html>
          EOF_HTML
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Calc com.example.calc --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd app/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calc-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
