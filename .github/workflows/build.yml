```yaml
name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create project
        run: |
          mkdir app && cd app && mkdir www
          cat > www/index.html <<'EOF_HTML'
          <!DOCTYPE html>
          <html lang="ckb" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>حیسابکەر</title>
          <style>
          :root{
            --bg:#f3f5f7; --surface:#ffffff; --text:#14202b; --muted:#5b6b7a;
            --line:#d5dde4; --accent:#0f6b5c; --accent-text:#ffffff; --err:#b3261e;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top,0px);
            padding-bottom:env(safe-area-inset-bottom,0px);
          }
          @media (prefers-color-scheme:dark){
            :root:not([data-theme="light"]){
              --bg:#0e151b; --surface:#16212a; --text:#e8eef3; --muted:#93a4b3;
              --line:#2a3a47; --accent:#3cc4a8; --accent-text:#06231d; --err:#ff8a80;
            }
          }
          :root[data-theme="dark"]{
            --bg:#0e151b; --surface:#16212a; --text:#e8eef3; --muted:#93a4b3;
            --line:#2a3a47; --accent:#3cc4a8; --accent-text:#06231d; --err:#ff8a80;
          }
          *{box-sizing:border-box}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          body{
            margin:0; background:var(--bg); color:var(--text);
            font-family:"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
            line-height:1.7; min-height:100vh;
          }
          main{max-width:520px; margin:0 auto; padding:20px 16px 40px}
          h1{font-size:1.6rem; margin:8px 0 4px}
          p.hint{color:var(--muted); margin:0 0 16px}
          .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
          label{display:block; font-weight:700; margin-bottom:8px}
          textarea{
            width:100%; min-height:96px; resize:vertical; padding:12px;
            font:inherit; font-size:1.1rem; direction:ltr; text-align:left;
            color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px;
          }
          textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
          button{
            margin-top:12px; width:100%; padding:14px; font:inherit; font-size:1.1rem; font-weight:700;
            color:var(--accent-text); background:var(--accent); border:0; border-radius:8px; cursor:pointer;
          }
          .result{margin-top:16px; text-align:center}
          .result .num{font-size:3rem; font-weight:700; direction:ltr; word-break:break-all}
          .result .err{color:var(--err); font-weight:700}
          .steps{margin-top:16px; border-top:1px solid var(--line); padding-top:12px; color:var(--muted); font-size:.95rem; direction:ltr; text-align:left}
          .steps div{display:flex; justify-content:space-between; gap:12px; padding:2px 0}
          .steps b{color:var(--text)}
          #cur{width:100%; margin-top:16px; padding:8px; font:inherit; font-size:1.3rem; direction:ltr; text-align:center; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px}
          .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px auto 0; max-width:240px}
          .pad button{margin:0; padding:9px 0; font-size:1.2rem; color:var(--text); background:var(--bg); border:1px solid var(--line)}
          .pad button:active{background:var(--line)}
          .pad button.ok{color:var(--accent-text); background:var(--accent); border-color:var(--accent)}
          .clear{width:auto; margin-top:8px; padding:4px 12px; font-size:.85rem; font-weight:400; color:var(--muted); background:transparent; border:1px solid var(--line)}
          </style>
          </head>
          <body>
          <main>
            <div class="card">
              <label for="inp">ژمارەکان (٧ ژمارە)</label>
              <textarea id="inp" inputmode="none">34,5,22,4,10,6,30</textarea>
              <button id="clr" type="button" class="clear">سړینەوەی هەموو</button>
              <div class="result" id="out" aria-live="polite"></div>
              <input id="cur" type="text" readonly inputmode="none" aria-label="ژمارە">
              <div class="pad" id="pad">
                <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
                <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
                <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
                <button type="button" data-k="del" aria-label="سرینەوە">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="ok">OK</button>
              </div>
            </div>
          </main>
          <script>
          const R=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
          const inp=document.getElementById('inp'), out=document.getElementById('out');
          const mod=(n,m)=>((n%m)+m)%m;
          const fdiv=(a,b)=>Math.floor(a/b);

          function calc(az){
            if(az.length<6) throw new Error('بەلانی کەم ٦ ژمارە پێویستە.');
            const num=Math.abs(fdiv(az[1]+az[2],az[3])-az[4]);
            const i=R.indexOf(num);
            if(i<0) throw new Error('ژمارەی '+num+' لە لیستی r نییە.');
            const left=R[mod(i-1,37)], right=R[mod(i+1,37)];
            const p1=(left+num)*(num+right);
            const d=Math.abs(p1-(1000+az[0]))/9.6;
            if(d===0) throw new Error('دابەشکردن بە سفر.');
            const A=fdiv(p1,d);
            if(A===0) throw new Error('دابەشکردن بە سفر.');
            const A1=fdiv(p1,A*1.69);
            return {num,left,right,p1,A,A1};
          }

          function run(){
            try{
              const az=inp.value.replace(/[،؛;\s]+/g,',').split(',').filter(Boolean).map(x=>{
                const n=parseInt(x,10); if(Number.isNaN(n)) throw new Error('"'+x+'" ژمارە نییە.'); return n;});
              if(az[3]===0) throw new Error('ژمارەی چوارەم نابێت سفر بێت.');
              const r=calc(az);
              out.innerHTML='<div class="num">'+r.A1+'</div>';
            }catch(e){
              out.innerHTML='<div class="err">'+e.message.replace(/</g,'&lt;')+'</div>';
            }
          }
          const cur=document.getElementById('cur');
          document.getElementById('clr').addEventListener('click',()=>{inp.value='';cur.value='';out.innerHTML='';});
          document.getElementById('pad').addEventListener('click',e=>{
            const b=e.target.closest('button'); if(!b) return;
            const k=b.dataset.k;
            if(k==='ok'){
              if(!cur.value) return;
              const t=inp.value.trim();
              inp.value=cur.value+(t?','+t:'');
              cur.value='';
              run();
            } else if(k==='del') cur.value=cur.value.slice(0,-1);
            else cur.value+=k;
          });

          run();
          </script>
          </body>
          </html>
          EOF_HTML
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Calc com.example.calc --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd app/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calc-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
```
